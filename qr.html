      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
    }
    .card {
      background: #1E293B;
      padding: 36px 32px;
      border-radius: 20px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      border: 1px solid #334155;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

      margin: 0 0 8px;
      font-size: 26px;
      font-weight: 700;
      color: #14B8A6;
    }
    .subtitle {
      margin: 0 0 24px;
      font-size: 16px;
      color: #94A3B8;
      line-height: 1.5;
    }
    .qr-frame {
      background: #FFFFFF;
      padding: 20px;
      border-radius: 16px;
      display: inline-block;
      margin-bottom: 24px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    }
    .url-box {
      background: #0F172A;
      border: 1px solid #334155;
      padding: 12px 16px;
      border-radius: 10px;
      font-family: monospace;
      font-size: 16px;
      color: #38BDF8;
      margin-bottom: 20px;
      word-break: break-all;
    }
    .instructions {
      font-size: 15px;
      color: #CBD5E1;
      text-align: left;
      background: rgba(20, 184, 166, 0.08);
      border: 1px solid rgba(20, 184, 166, 0.2);
      border-radius: 10px;
      padding: 14px 18px;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .instructions ol {
      margin: 0;
      padding-left: 20px;
    }
    .instructions li {
      margin-bottom: 6px;
    }
    .instructions li:last-child {
      margin-bottom: 0;
    }
    .footer {
      font-size: 14px;
      color: #64748B;
      margin-top: 12px;
      font-weight: 500;
    }
  </style>
